<body class="container-fluid bg-light">
  <div class="container py-3">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb" style="margin: 0;">
        <li class="breadcrumb-item"><a class="text-decoration-none" routerLink="/">Trang chủ</a></li>
        <li class="breadcrumb-item active" aria-current="page">Tác giả</li>
      </ol>
    </nav>
  </div>

  <div class="container content bg-white">
    <div class="row p-3">
      <div class="col-md-4 col-sm-6 col-12">
        <div class="input-group position-relative">
          <input
            type="text"
            class="form-control focus-ring focus-ring-warning ipt-author"
            placeholder="Nhập tên tác giả ..."
            [(ngModel)]="searchTerm"
            (input)="onSearchInput($event)"
            (focus)="onFocus()"
          >
          <!-- Dropdown results -->
          <div class="search-results" *ngIf="showDropdown">
            <div class="loading" *ngIf="isLoading">
              Đang tìm kiếm...
            </div>

            <div class="no-results" *ngIf="!isLoading && searchTerm && filteredAuthors.length === 0">
              Không tìm thấy tác giả phù hợp
            </div>

            <div class="results-list" *ngIf="!isLoading && filteredAuthors.length > 0">
              <div
                class="result-item"
                *ngFor="let author of filteredAuthors"
                (click)="selectAuthor(author)"
              >
                {{ author.name }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <hr class="m-0">
  </div>
</body>
