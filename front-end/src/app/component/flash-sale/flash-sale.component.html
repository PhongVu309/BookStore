<body class="container-fuild bg-light">
  <div class="container content" #productContainer>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb" style="padding-top: 16px">
        <li class="breadcrumb-item">
          <a routerLink="/" class="text-decoration-none">Trang chủ</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Flashsale</li>
      </ol>
    </nav>

    <div class="banner-flash-sale">
      <img src="assets/img/flash-sale/flashBookStore.jpg" alt="" />
    </div>

    <div
      class="container justify-content-center align-items-center bg-white flash-sale"
    >
      <div class="row d-flex group-time">
        <h2 class="flashsale-title text-upcase">
          flash sale
          <span class="text-lowercase" style="font-size: 1rem"
            >kết thúc trong</span
          >
          <span class="countdown">
            <small>00</small>
            :
            <small>00</small>
            :
            <small>00</small>
          </span>
        </h2>
      </div>

      <hr class="m-0" style="margin: 16px 0 24px 0 !important" />

      <div class="row list-products" style="margin: 16px">
        <div
          class="col-6 col-sm-6 col-md-4 col-lg-2 item-products"
          *ngFor="let product of displayedProducts"
        >
          <div class="position-relative img-product">
            <a routerLink="/detail-product/{{ product.id }}">
              <img [src]="product.image" class="img-fluid" alt="" />
            </a>
            <span class="position-absolute discount-product"
              >{{ product.discount }}%</span
            >
          </div>
          <div class="infor-products">
            <a routerLink="/detail-product/{{ product.id }}" class="name-product">
              <h6>{{ product.name }}</h6>
            </a>
            <p class="price" style="margin-top: 20px">
              {{ product.price | currency : "VND" }}
            </p>
            <p>
              <del>{{ product.original_price | currency : "VND" }}</del>
            </p>
            <p>
              <span
                class="star-rating"
                *ngFor="let star of [].constructor(product.rating)"
              >
                <i class="fa-solid fa-star"></i>
              </span>
              <span class="text-rating">({{ product.preview }})</span>
            </p>
          </div>
        </div>
      </div>

      <div class="pagination-controls py-3">
        <button
          class="btn"
          (click)="previousPage()"
          [disabled]="currentPage === 1"
        >
          Trước
        </button>
        <ng-container *ngFor="let page of pages">
          <button
            class="btn"
            *ngIf="page !== '...'"
            (click)="goToPage(+page)"
            [class.active]="page === currentPage"
          >
            {{ page }}
          </button>
          <span *ngIf="page === '...'">{{ page }}</span>
        </ng-container>
        <button
          class="btn"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages"
        >
          Sau
        </button>
      </div>
    </div>
  </div>
</body>
