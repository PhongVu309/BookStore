<body class="container-fuild bg-light">
  <div class="container py-3" #productContainer>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a class="text-decoration-none" routerLink="/">Trang chủ</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Sách truyện</li>
      </ol>
    </nav>
  </div>

  <div class="container bg-white">
    <div class="row">
      <!-- Desktop Categories Sidebar -->
      <div class="d-none d-lg-block col-lg-3">
        <div class="row pr-lg-3">
          <div class="w-100">
            <div class="p-2 sub-page-nav">
              <h4 class="title-nav text-upcase mt-0 mb-1">Nhóm sản phẩm</h4>
              <span class="current-nav">Sách truyện</span>
              <div class="list-child ps-3">
                <ul class="list-unstyled">
                  <li *ngFor="let category of categories">
                    <a class="text-decoration-none" [routerLink]="['/book-categories', category.name]">
                      {{ category.name }}
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Categories Toggle -->
      <div class="d-block d-lg-none col-12">
        <div class="row pr-lg-3">
          <div class="bg-white w-100 pt-2">
            <div class="d-flex justify-content-start">
              <div class="filter">
                <span class="icon-filter btn btn-warning ms-3 me-1" (click)="toggleFilter()">
                  <i class="fa-solid fa-filter"></i>
                </span>
              </div>

              <div class="filter">
                <form action="" class="form-inline">
                  <div class="form-group mb-2 me-2">
                    <select name="sort" class="form-control form-control-sm" (change)="sortProducts($event)">
                      <option value="newest">Mới nhất</option>
                      <option value="price_asc">Giá thấp đến cao</option>
                      <option value="price_desc">Giá cao đến thấp</option>
                    </select>
                  </div>
                </form>
              </div>
            </div>

            <!-- Mobile Categories List -->
            <div class="filter-toggle p-2 sub-page-nav" *ngIf="isFilterVisible">
              <div class="p-2">
                <h4 class="title-nav text-upcase mt-0 mb-1">Nhóm sản phẩm</h4>
                <span class="current-nav">Sách truyện</span>
                <div class="list-child ps-3">
                  <ul class="list-unstyled">
                    <li *ngFor="let category of categories">
                      <a class="text-decoration-none" [routerLink]="['/book-categories', category.id]">
                        {{ category.name }}
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="col-lg-9">
        <div class="form-filter mt-3 d-none d-lg-block">
          <form action="" class="form-inline">
            <div class="d-none d-md-flex form-group mb-2 ml-4 me-2 position-relative">
              <label for="" class="me-2 d-none d-lg-block">Sắp xếp </label>
              <select name="sort" class="form-control form-control-sm w-auto" (change)="sortProducts($event)">
                <option value="newest">Mới nhất </option>
                <option value="price_asc">Giá thấp đến cao</option>
                <option value="price_desc">Giá cao đến thấp</option>
              </select>
            </div>
          </form>
        </div>

        <div class="row list-products" style="margin: 16px">
          <div class="col-6 col-sm-6 col-md-4 col-lg-3 item-products" *ngFor="let product of displayedProducts">
            <div class="position-relative img-product">
              <a [routerLink]="['/detail-product', product.id]">
                <img [src]="product.image" class="img-fluid" [alt]="product.name"/>
              </a>
              <span class="position-absolute discount-product">{{product.discount}}%</span>
            </div>
            <div class="infor-products">
              <a [routerLink]="['/detail-product', product.id]" class="name-product">
                <h6>{{product.name}}</h6>
              </a>
              <p class="price">{{product.price | currency:'VND'}}</p>
              <p><del>{{product.original_price | currency:'VND'}}</del></p>
              <p>
                <span class="star-rating" *ngFor="let star of [].constructor(product.rating)">
                  <i class="fa-solid fa-star"></i>
                </span>
                <span class="text-rating">({{ product.preview }})</span>
              </p>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <div class="pagination-controls py-3">
          <button class="btn" (click)="previousPage()" [disabled]="currentPage === 1">Trước</button>
          <ng-container *ngFor="let page of pages">
            <button class="btn" *ngIf="page !== '...'" (click)="goToPage(+page)"
              [class.active]="page === currentPage">{{ page }}</button>
            <span *ngIf="page === '...'">{{ page }}</span>
          </ng-container>
          <button class="btn" (click)="nextPage()" [disabled]="currentPage === totalPages">Sau</button>
        </div>
      </div>
    </div>
  </div>
</body>
